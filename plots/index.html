<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#1B1E20">
<title>Prudhvi Raj back office</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --side:#1B1E20; --side-2:#272B2D; --side-line:#363B3E; --side-text:#D6DADB; --side-mute:#98A0A2;
  --ground:#F4F5F5; --surface:#FFFFFF; --line:#E1E4E4; --line-2:#ECEEEE;
  --ink:#17171A; --ink-2:#44444A; --mute:#66666B;
  --em:#0A6B4A; --em-strong:#07573C; --em-tint:#E2F2EA; --em-line:#B5DCC8;
  --amber:#8A5200; --amber-tint:#FCEFD2; --amber-line:#EBCB8B;
  --red:#B4231B; --red-tint:#FBE6E3; --red-line:#EFB5AF;
  --slate-tint:#E9EBEF; --slate:#3D4656;
  --r:8px; --top:60px;
  --shadow:0 12px 32px rgba(23,23,26,.16), 0 2px 6px rgba(23,23,26,.08);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--ground);color:var(--ink);font:400 15px/1.5 "Geist",system-ui,-apple-system,"Segoe UI",sans-serif;font-feature-settings:"tnum" 1,"cv11" 1;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3,p{margin:0}
a{color:inherit}
:focus-visible{outline:2px solid var(--em);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
svg{display:block;flex:none}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100vh;background:linear-gradient(to right,var(--side) 248px,var(--ground) 248px)}
.side{background:var(--side);color:var(--side-text);position:sticky;top:0;height:100vh;display:flex;flex-direction:column;overflow-y:auto}
.side-logo{padding:22px 20px 20px}
.side-logo img{width:104px;height:auto;display:block}
.side-nav{padding:0 12px;display:grid;gap:4px}
.nav{display:flex;align-items:center;gap:12px;width:100%;min-height:44px;padding:8px 10px;border:0;background:none;color:var(--side-text);border-radius:6px;text-align:left;font-weight:500}
.nav:hover{background:var(--side-2)}
.nav[aria-current="page"]{background:#34322F;color:#fff}
.nav.act{margin-top:20px}
.side-user{margin-top:auto;padding:16px 20px;border-top:1px solid var(--side-line);display:flex;gap:10px;align-items:center}
.avatar{width:34px;height:34px;border-radius:50%;background:#45423E;color:#fff;display:grid;place-items:center;font-weight:600;font-size:12px}
.side-user b{display:block;font-weight:500;color:#fff;font-size:14px}
.side-user span{font-size:13px;color:var(--side-mute)}

.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:20;height:var(--top);background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:0 28px}
.search{position:relative;flex:1;max-width:440px}
.search input{width:100%;height:40px;border:1px solid var(--line);border-radius:var(--r);background:var(--ground);padding:0 12px 0 36px;outline-offset:0}
.search input::placeholder{color:var(--mute)}
.search input:focus{background:#fff;border-color:var(--em);outline:2px solid var(--em-tint)}
.search > svg{position:absolute;left:12px;top:12px;color:var(--mute)}
.results{position:absolute;left:0;right:0;top:46px;background:#fff;border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:4px;display:none;z-index:30}
.results.on{display:block}
.results button{display:flex;width:100%;gap:10px;align-items:baseline;padding:9px 10px;border:0;background:none;border-radius:6px;text-align:left;min-height:44px}
.results button:hover,.results button:focus{background:var(--ground)}
.results .rp{font-weight:600;min-width:68px}
.results .rv{margin-left:auto;color:var(--mute);font-size:14px;white-space:nowrap}
.results .none{padding:10px;color:var(--mute)}
.top-right{margin-left:auto;display:flex;align-items:center;gap:14px}
.m-only{display:none}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 16px;border-radius:var(--r);border:1px solid var(--line);background:#fff;font-weight:500;white-space:nowrap;transition:background .12s,border-color .12s}
.btn:hover{background:var(--ground);border-color:#CFCFCA}
.btn.primary{background:var(--em);border-color:var(--em);color:#fff}
.btn.primary:hover{background:var(--em-strong);border-color:var(--em-strong)}
.btn.sm{height:36px;padding:0 12px;font-size:14px}
.btn.quiet{border-color:transparent;background:none;color:var(--ink-2);padding:0 12px}
.btn.quiet:hover{background:#E9EBEB;border-color:transparent;color:var(--ink)}

.page{padding:32px 28px 72px;max-width:1192px;width:100%}
.page-head{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:24px}
.title{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.page-head h1{font-size:28px;line-height:1.2;font-weight:600;letter-spacing:-.02em}
.head-right{margin-left:auto}
.scope{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:13px;font-size:13px;font-weight:500;background:var(--side);color:#fff}
.select{position:relative}
.select select{appearance:none;height:40px;border:1px solid var(--line);border-radius:var(--r);background:#fff;padding:0 36px 0 14px;font-weight:500;max-width:100%}
.select svg{position:absolute;right:12px;top:13px;pointer-events:none;color:var(--mute)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:22px 24px}
.card h2{font-size:17px;font-weight:600;letter-spacing:-.005em}
.card-head{display:flex;align-items:baseline;gap:12px}
.card-head .meta{margin-left:auto;color:var(--mute);font-size:14px}

/* ---------- chips ---------- */
.chip{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 9px;border-radius:5px;font-size:13px;font-weight:500;white-space:nowrap;border:1px solid transparent}
.chip.ok{background:var(--em-tint);color:var(--em-strong);border-color:var(--em-line)}
.chip.warn{background:var(--amber-tint);color:var(--amber);border-color:var(--amber-line)}
.chip.bad{background:var(--red-tint);color:var(--red);border-color:var(--red-line)}
.chip.neutral{background:var(--ground);color:var(--ink-2);border-color:var(--line)}
.chip.dark{background:var(--side);color:#fff}

/* ---------- morning ---------- */
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:24px;border:1px solid var(--line);border-radius:var(--r);background:#fff;padding:26px 28px 24px;margin-bottom:24px}
.stat{align-self:start;padding:0;border:0;background:none;text-align:left;display:block;width:100%;min-width:0}
.stat .k{font-weight:500;color:var(--ink-2)}
.stat .v{font-size:42px;line-height:1.1;font-weight:600;letter-spacing:-.03em;margin:10px 0 8px;white-space:nowrap}
.stat.pos .v{color:var(--em)}
.stat.neg .v{color:var(--red)}
.stat .n{color:var(--mute)}
button.stat:hover .k{text-decoration:underline;text-underline-offset:3px}

.grid-2{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:24px;align-items:start}
.stack{display:grid;gap:24px;min-width:0}

.appr{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:6px 24px;align-items:center;padding:14px 0;border-top:1px solid var(--line-2)}
.card-head + .appr{border-top:0;margin-top:4px}
.appr:last-child{padding-bottom:0}
.appr .what{font-weight:600}
.appr .why{color:var(--mute);font-size:14px}
.appr .amt{font-weight:600;font-size:17px;text-align:right;white-space:nowrap}
.appr .acts{display:flex;gap:8px;justify-content:flex-end;align-items:center;min-width:196px}
.appr .acts .btn{min-width:94px}

.match{display:flex;align-items:flex-start;gap:10px;font-size:15px;font-weight:500;margin-top:10px}
.match svg{color:var(--em);margin-top:1px}

.chq{display:flex;align-items:center;gap:12px}
.chq p{font-size:16px;font-weight:500}
.chq .btn{margin-left:auto}
.chq-list{margin-top:10px}
.row{display:flex;gap:12px;align-items:baseline;padding:10px 0;border-top:1px solid var(--line-2)}
.row:last-child{padding-bottom:0}
.row b{font-weight:500;display:block}
.row .r{margin-left:auto;font-weight:600;white-space:nowrap}
.row .s{color:var(--mute);font-size:14px}

.od{display:grid;grid-template-columns:minmax(0,1fr) 116px 128px;gap:0 16px;align-items:center;width:100%;padding:11px 0;border:0;border-top:1px solid var(--line-2);background:none;text-align:left}
h2 + .od{border-top:0;margin-top:6px}
.od:last-child{padding-bottom:0}
.od:hover .nm{text-decoration:underline;text-underline-offset:3px}
.od .nm{font-weight:600;display:block}
.od .pl{color:var(--mute);font-size:14px;display:block}
.od .amt{font-weight:600;text-align:right;white-space:nowrap}
.od .late{justify-self:end}
.none{color:var(--mute);margin-top:8px}

.bars{display:grid;grid-template-columns:repeat(6,1fr);gap:14px;align-items:end;height:150px;margin-top:34px}
.bar{position:relative;background:#C6C9C4;border-radius:4px 4px 0 0;min-height:2px;max-width:60px;width:100%;justify-self:center}
.bar.now{background:var(--em)}
.bar b{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(100% + 5px);font-size:14px;font-weight:600;white-space:nowrap}
.xaxis{display:grid;grid-template-columns:repeat(6,1fr);gap:14px;padding-top:8px;font-size:14px;color:var(--mute);text-align:center}
.xaxis .now{color:var(--ink);font-weight:600}

table{border-collapse:collapse;width:100%}
th{font-size:14px;font-weight:500;color:var(--mute);text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:13px 12px;border-bottom:1px solid var(--line-2);vertical-align:middle}
th:first-child,td:first-child{padding-left:0} th:last-child,td:last-child{padding-right:0}
tr:last-child td{border-bottom:0;padding-bottom:2px}
.num{text-align:right;white-space:nowrap}
td.num{font-weight:600}
td .sub{display:block;color:var(--mute);font-size:14px}
.mute{color:var(--mute)}

/* ---------- plots ---------- */
.legend{display:flex;flex-wrap:wrap;gap:4px 6px;margin:-4px 0 18px -8px}
.lg{display:inline-flex;align-items:center;gap:9px;height:40px;padding:0 12px 0 8px;border:0;border-radius:var(--r);background:none;font-weight:500}
.lg:hover{background:var(--ground)}
.lg[aria-pressed="true"]{background:var(--ground);box-shadow:inset 0 0 0 1.5px var(--ink)}
.lg .sw{width:24px;height:24px;border-radius:4px;display:grid;place-items:center}
.lg b{font-weight:600}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(60px,1fr));gap:6px}
.tile{position:relative;height:54px;border-radius:5px;border:1px solid transparent;padding:7px 8px;text-align:left;font-weight:600;font-size:15px;line-height:1;display:flex;flex-direction:column;justify-content:space-between;transition:opacity .15s}
.tile svg{align-self:flex-end}
.tile:hover{outline:2px solid var(--ink);outline-offset:1px}
.tile.dim{opacity:.22}
.st-available{background:#fff;border:1px dashed #A9A9A3;color:var(--ink-2)}
.st-booked{background:var(--slate-tint);border-color:#C9CED8;color:var(--slate)}
.st-paying{background:var(--em-tint);border-color:var(--em-line);color:var(--em-strong)}
.st-overdue{background:var(--red-tint);border-color:var(--red);color:var(--red)}
.st-registered{background:var(--side-2);border-color:var(--side-2);color:#fff}

/* ---------- customer ---------- */
.crumb{margin:-8px 0 10px}
.crumb button{display:inline-flex;align-items:center;gap:6px;border:0;background:none;padding:6px 0;color:var(--ink-2);font-weight:500}
.crumb button:hover{color:var(--ink)}
.cust-head{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap;margin-bottom:24px}
.cust-head h1{font-size:28px;font-weight:600;letter-spacing:-.02em;display:flex;align-items:center;gap:12px;flex-wrap:wrap;line-height:1.2}
.cust-head .who{margin-top:6px;font-size:17px;font-weight:500}
.cust-head .det{color:var(--mute);margin-top:2px}
.actions{margin-left:auto;display:flex;gap:4px;flex-wrap:wrap;align-items:center}
.actions .primary{margin-right:8px}
.money{margin-bottom:24px}
.sum{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:32px}
.sum .k{font-weight:500;color:var(--ink-2)}
.sum .v{font-size:36px;line-height:1.1;font-weight:600;letter-spacing:-.03em;margin:8px 0 6px;white-space:nowrap}
.sum .n{color:var(--mute);font-size:14px}
.sum .v.pos{color:var(--em)}
.prog{height:8px;border-radius:4px;background:var(--line);margin-top:8px;overflow:hidden;max-width:260px}
.prog i{display:block;height:100%;background:var(--em);border-radius:4px;transition:width .35s ease}
.next{margin-top:22px;padding-top:18px;border-top:1px solid var(--line-2)}
.next p{font-size:16px}
.next p b{font-weight:600}
.next .late{color:var(--red);font-weight:600;white-space:nowrap}
.nw{white-space:nowrap}
.next .ag{color:var(--mute);font-size:15px;margin-top:4px}
.pay-card h2{margin-bottom:8px}
.kv{margin:0}
.kv dt{color:var(--mute)}
.kv div{display:flex;gap:12px;padding:10px 0;border-top:1px solid var(--line-2);align-items:baseline}
.kv div:first-child{border-top:0}
.kv dd{margin:0 0 0 auto;font-weight:500;text-align:right}
.pm{display:none}
.avail-box{max-width:520px}
.avail-box p{color:var(--ink-2);margin:8px 0 18px}

/* ---------- overlays ---------- */
.scrim{position:fixed;inset:0;background:rgba(23,23,26,.38);opacity:0;pointer-events:none;transition:opacity .18s;z-index:40}
.scrim.on{opacity:1;pointer-events:auto}
.panel{position:fixed;top:0;right:0;bottom:0;width:440px;max-width:100vw;background:#fff;box-shadow:var(--shadow);transform:translateX(102%);transition:transform .22s cubic-bezier(.2,.7,.3,1);z-index:50;display:flex;flex-direction:column;visibility:hidden}
.panel.on{transform:none;visibility:visible}
.panel-head{display:flex;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line)}
.panel-head h2{font-size:17px;font-weight:600}
.x{margin-left:auto;width:36px;height:36px;border:0;background:none;border-radius:var(--r);display:grid;place-items:center}
.x:hover{background:var(--ground)}
.panel-body{padding:20px;overflow-y:auto;flex:1}
.panel-foot{padding:14px 20px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end}
.field{margin-bottom:18px;position:relative}
.field label,.field .lab{display:block;font-weight:500;font-size:13px;margin-bottom:6px}
.field input[type=text],.field input[type=search]{width:100%;height:44px;border:1px solid #CFCFCA;border-radius:var(--r);padding:0 12px;background:#fff;font-size:15px}
.field input:focus{border-color:var(--em);outline:2px solid var(--em-tint);outline-offset:0}
.field .hint{font-size:13px;color:var(--mute);margin-top:6px;min-height:19px}
.field .err{color:var(--red)}
.amt-wrap{position:relative}
.amt-wrap span{position:absolute;left:12px;top:9px;font-size:20px;font-weight:500;color:var(--mute)}
.amt-wrap input{padding-left:34px !important;font-size:22px !important;font-weight:600;height:52px !important;letter-spacing:-.01em}
.seg{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid #CFCFCA;border-radius:var(--r);overflow:hidden}
.seg button{height:44px;border:0;border-left:1px solid #CFCFCA;background:#fff;font-weight:500;font-size:13px;padding:0 4px}
.seg button:first-child{border-left:0}
.seg button[aria-pressed="true"]{background:var(--side);color:#fff}
.picked{display:flex;gap:10px;align-items:center;border:1px solid var(--line);background:var(--ground);border-radius:var(--r);padding:10px 12px}
.picked b{font-weight:600}
.picked .btn{margin-left:auto}
.sugg{border:1px solid var(--line);border-radius:var(--r);margin-top:6px;padding:4px;display:none}
.sugg.on{display:block}
.sugg button{display:flex;gap:10px;width:100%;border:0;background:none;padding:10px;border-radius:6px;text-align:left;min-height:44px;align-items:center}
.sugg button:hover,.sugg button:focus{background:var(--ground)}
.sugg .rv{margin-left:auto;color:var(--mute);font-size:13px}
.saved{text-align:left}
.saved .big{display:flex;gap:12px;align-items:center;padding:14px;border:1px solid var(--em-line);background:var(--em-tint);border-radius:var(--r);color:var(--em-strong);font-weight:500;margin-bottom:16px}
.modal{position:fixed;left:50%;top:50%;width:440px;max-width:calc(100vw - 32px);background:#fff;border-radius:10px;box-shadow:var(--shadow);transform:translate(-50%,-46%);opacity:0;pointer-events:none;transition:opacity .16s,transform .16s;z-index:50;visibility:hidden}
.modal.on{opacity:1;transform:translate(-50%,-50%);pointer-events:auto;visibility:visible}
.msg{margin:0 20px;padding:14px;border:1px solid var(--line);border-radius:var(--r);background:var(--ground);white-space:pre-line;font-size:14px;line-height:1.5}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);background:var(--side);color:#fff;padding:11px 16px;border-radius:var(--r);font-weight:500;opacity:0;pointer-events:none;transition:opacity .18s,transform .18s;z-index:60;max-width:calc(100vw - 32px);box-shadow:var(--shadow)}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* ---------- tablet ---------- */
@media (max-width:1100px){
  .grid-2{display:flex;flex-direction:column;align-items:stretch;gap:20px}
  .stack{display:contents}
  .o-appr{order:1}.o-match{order:2}.o-chq{order:3}.o-od{order:4}.o-chart{order:5}
  .stats{grid-template-columns:1fr 1fr;gap:28px 24px}
  .sum{gap:20px}
  .sum .v{font-size:30px}
}
/* ---------- phone ---------- */
@media (max-width:820px){
  :root{--top:56px}
  body{font-size:16px}
  .app{display:block;background:var(--ground)}
  .side{position:fixed;left:0;top:0;bottom:0;width:288px;max-width:86vw;height:auto;z-index:50;transform:translateX(-102%);transition:transform .22s cubic-bezier(.2,.7,.3,1);visibility:hidden}
  .side.on{transform:none;visibility:visible}
  .nav{min-height:48px}
  .top{background:var(--side);border-bottom:0;padding:0 8px 0 4px;gap:4px;color:#fff}
  .m-only{display:flex}
  .icon-btn{width:44px;height:44px;border:0;background:none;color:#fff;border-radius:var(--r);display:grid;place-items:center}
  .brand{display:flex;align-items:center;gap:9px;font-weight:600;font-size:16px;min-width:0;margin-right:auto}
  .brand img{height:26px;width:auto}
  .brand span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .top .search{display:none;position:absolute;left:0;right:0;top:var(--top);max-width:none;background:var(--side);padding:0 12px 12px}
  .top .search.open{display:block}
  .top .search input{height:44px;background:#fff;font-size:16px;color:var(--ink)}
  .top .search > svg{left:24px;top:14px}
  .results{left:12px;right:12px;top:48px;color:var(--ink)}
  .results button{min-height:48px}
  .top-right .d-only{display:none}
  .top-right{gap:0;margin-left:0}
  .page{padding:20px 16px 150px}
  .page-head{margin-bottom:16px}
  .page-head h1,.cust-head h1{font-size:26px}
  .head-right{margin-left:0;width:100%}
  .select,.select select{width:100%;height:48px}
  .select svg{top:17px}
  .btn,.btn.sm{height:44px;font-size:16px}
  .card{padding:18px 16px}
  .stats{gap:22px 14px;padding:20px 16px;margin-bottom:20px}
  .stat .k{font-size:14px}
  .stat .v{font-size:26px;margin:6px 0 4px}
  .stat .n{font-size:14px}
  .appr{grid-template-columns:minmax(0,1fr) auto;gap:10px 12px;padding:16px 0}
  .appr .acts{grid-column:1 / -1;justify-content:flex-start;min-width:0}
  .appr .acts .btn{flex:1}
  .appr .acts .chip{margin-right:auto}
  .appr .acts .chip + .btn{flex:none}
  .chq .btn{min-width:76px}
  .od{grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"nm amt" "nm late";gap:4px 12px;padding:12px 0}
  .od > span:first-child{grid-area:nm}
  .od .amt{grid-area:amt}
  .od .late{grid-area:late}
  .match{font-size:16px}

function lookup(q){
  q=q.trim().toLowerCase();if(!q)return [];
  var digits=q.replace(/\D/g,''),out=[];
  V.forEach(function(v){PLOTS[v.id].forEach(function(p){
    var hit=(digits&&q===digits&&(String(p.no).indexOf(digits)===0||(p.phone&&p.phone.replace(/\D/g,'').indexOf(digits)>=0)))||(p.name&&q.length>1&&q!==digits&&p.name.toLowerCase().indexOf(q)>=0)||(q.indexOf('plot')===0&&digits&&String(p.no)===digits);
    if(hit)out.push(p)})});
  out.sort(function(a,b){return (String(a.no)===digits?0:1)-(String(b.no)===digits?0:1)});
  return out.slice(0,6);
}

function drawForm(){
  var p=form.plot,s=p&&sale(p),next=s&&s.rows.filter(function(r){return r.st==='overdue'||r.st==='upcoming'})[0];
  document.getElementById('panelTitle').textContent='Add payment';
  document.getElementById('panelBody').innerHTML=
  '<div class="field"><label for="fPlot">Plot or customer</label>'+
   (p?'<div class="picked"><div><b>Plot '+p.no+'</b>, '+esc(VBY[p.v].name)+'<br><span class="mute">'+esc(p.name)+'. Balance '+inr(s.price-paidOf(s))+'</span></div><button class="btn sm" id="fChange">Change</button></div>'
     :'<input id="fPlot" type="search" placeholder="Type a plot number, name or phone" autocomplete="off"><div class="sugg" id="fSugg"></div><div class="hint" id="fPlotHint">Try 114 or Ramesh</div>')+'</div>'+
  '<div class="field"><label for="fAmt">Amount received</label><div class="amt-wrap"><span>₹</span><input id="fAmt" type="text" inputmode="numeric" autocomplete="off" value="'+(form.amt?form.amt.toLocaleString('en-IN'):'')+'"></div><div class="hint" id="fWords">'+(next?'Next due is '+inr(next.amt)+' ('+next.label+')':'')+'</div>'+
   (next?'<button class="btn sm" id="fFill" type="button">Fill '+inr(next.amt)+'</button>':'')+'</div>'+
  '<div class="field"><span class="lab" id="modeLab">Mode</span><div class="seg" role="group" aria-labelledby="modeLab">'+['Cash','Bank transfer','Cheque','UPI'].map(function(m){return '<button type="button" data-mode="'+m+'" aria-pressed="'+(form.mode===m)+'">'+m+'</button>'}).join('')+'</div>'+
   '<div class="hint" id="fModeHint">'+modeHint()+'</div></div>'+
  '<div class="field" id="fRefWrap"'+(form.mode==='Cash'?' hidden':'')+'><label for="fRef" id="fRefLab">'+refLabel()+'</label><input id="fRef" type="text" autocomplete="off" value="'+esc(form.ref)+'"></div>'+
  '<div class="field" style="margin-bottom:0"><span class="lab">Date</span><div class="picked"><span>15 Nov 2026, today</span></div><div class="hint">Receipt '+rc(receiptNo)+' will be issued on save.</div></div>';
  document.getElementById('panelFoot').innerHTML='<button class="btn" data-close>Cancel</button><button class="btn primary" id="fSave">Save payment</button>';
}
function modeHint(){return form.mode==='Cheque'?'Shown as cheque pending. Not counted in paid until it clears.':form.mode==='Cash'?'Counts towards today’s cash for day close.':'Listed for ticking against the bank statement.'}
function refLabel(){return form.mode==='Cheque'?'Cheque number':form.mode==='UPI'?'UPI reference':'Bank reference'}
panel.addEventListener('input',function(e){
  if(e.target.id==='fAmt'){var n=parseInt(e.target.value.replace(/\D/g,''),10)||0;form.amt=n;e.target.value=n?n.toLocaleString('en-IN'):'';var w=document.getElementById('fWords');w.className='hint';w.textContent=words(n)}
  if(e.target.id==='fRef')form.ref=e.target.value;
  if(e.target.id==='fPlot'){var sg=document.getElementById('fSugg'),val=e.target.value.trim();sg.classList.toggle('on',!!val);
    if(val)sg.innerHTML=resultHTML(lookup(val).filter(function(p){return p.st!=='available'}),'data-pick')}
});
panel.addEventListener('click',function(e){
  var b=e.target.closest('button');if(!b)return;
  if(b.dataset.pick){var k=b.dataset.pick.split(':');form.plot=findPlot(k[0],+k[1]);drawForm();document.getElementById('fAmt').focus()}
  else if(b.id==='fChange'){form.plot=null;drawForm();document.getElementById('fPlot').focus()}
  else if(b.id==='fFill'){var s=sale(form.plot),n=s.rows.filter(function(r){return r.st==='overdue'||r.st==='upcoming'})[0];form.amt=n.amt;drawForm()}
  else if(b.dataset.mode){form.mode=b.dataset.mode;panel.querySelectorAll('[data-mode]').forEach(function(x){x.setAttribute('aria-pressed',x===b)});
    document.getElementById('fModeHint').textContent=modeHint();document.getElementById('fRefWrap').hidden=form.mode==='Cash';document.getElementById('fRefLab').textContent=refLabel()}
  else if(b.id==='fSave')savePay();
  else if(b.id==='fAgain'){openPay(false)}
  else if(b.id==='fView'){go('customer',{cur:{v:form.plot.v,no:form.plot.no}})}
  else if(b.id==='fRcpt'){toast('Receipt '+b.dataset.r+' PDF is ready to print or share')}
});
function savePay(){
  var p=form.plot;
  if(!p){var h=document.getElementById('fPlotHint');h.className='hint err';h.textContent='Choose a plot or customer first.';document.getElementById('fPlot').focus();return}
  var s=sale(p),bal=s.price-paidOf(s),w=document.getElementById('fWords');
  if(!form.amt){w.className='hint err';w.textContent='Enter the amount received.';document.getElementById('fAmt').focus();return}
  if(form.amt>bal){w.className='hint err';w.textContent='More than the balance of '+inr(bal)+'. Check the amount.';document.getElementById('fAmt').focus();return}
  var rcpt=rc(receiptNo++),a=state.adj[p.v],label='Part payment';
  if(form.mode==='Cheque'){
    s.rows.push({date:TODAY,label:'Cheque received',amt:form.amt,mode:'Cheque',rcpt:rcpt,st:'pending'});
    state.cheques.push({v:p.v,plot:p.no,name:p.name.split(' & ')[0],amt:form.amt,date:TODAY});
  }else{
    /* applied to the oldest unpaid instalment first */
    var left=form.amt,cleared=[];
    s.rows.slice().forEach(function(r){
      if(left<=0||(r.st!=='overdue'&&r.st!=='upcoming'))return;
      var use=Math.min(left,r.amt);left-=use;
      if(r.st==='overdue')a.over+=use;
      r.amt-=use;
      if(r.amt===0){cleared.push(r.label);if(r.st==='overdue')a.overN+=1;s.rows.splice(s.rows.indexOf(r),1)}
    });
    if(cleared.length===1&&left===0)label=cleared[0];
    if(cleared.length>1)label=cleared.join(' and ');
    var row={date:TODAY,label:label,amt:form.amt,mode:form.mode,rcpt:rcpt,st:'received'},at=s.rows.length;
    for(var i=0;i<s.rows.length;i++){if(s.rows[i].st==='overdue'||s.rows[i].st==='upcoming'||s.rows[i].date>TODAY){at=i;break}}
    s.rows.splice(at,0,row);
    a.col+=form.amt;a.pay+=1;
    if(!s.rows.some(function(r){return r.st==='overdue'})&&p.st==='overdue')p.st='paying';
    if(p.st==='booked')p.st='paying';
  }
  var nb=s.price-paidOf(s);
  document.getElementById('panelTitle').textContent='Payment saved';
  document.getElementById('panelBody').innerHTML='<div class="saved"><div class="big">'+I.checkL+'<span>'+inr(form.amt)+' saved. Receipt '+rcpt+(form.mode==='Cheque'?', subject to realisation':'')+'.</span></div>'+
   '<dl class="kv" style="padding:0"><div><dt>Plot</dt><dd>Plot '+p.no+', '+esc(VBY[p.v].name)+'</dd></div><div><dt>Customer</dt><dd>'+esc(p.name)+'</dd></div><div><dt>Mode</dt><dd>'+form.mode+(form.ref?', '+esc(form.ref):'')+'</dd></div><div><dt>In words</dt><dd>'+words(form.amt)+'</dd></div><div><dt>'+(form.mode==='Cheque'?'Balance (cheque not yet counted)':'Balance after this payment')+'</dt><dd>'+inr(nb)+'</dd></div></dl></div>';
  document.getElementById('panelFoot').innerHTML='<button class="btn" id="fRcpt" data-r="'+rcpt+'">'+I.doc+'Receipt PDF</button><button class="btn" id="fAgain">Add another</button><button class="btn primary" id="fView">View plot</button>';
  render();
}

/* ---------- global clicks ---------- */
document.addEventListener('click',function(e){
  var t=e.target.closest('[data-go],[data-pay],[data-open],[data-approve],[data-hold],[data-undo],[data-focus],[data-chq],[data-close],[data-doc],[data-wa],[data-scroll],[data-role],#menuBtn,#searchBtn,#waSend');
  if(!t||t.closest('#panelBody,#panelFoot')&&!t.hasAttribute('data-close'))return;
  var ds=t.dataset,a;
  if(t.tagName==='A'&&ds.go)e.preventDefault();
  if(t.id==='menuBtn'){closeAll();opener=t;side.classList.add('on');scrim.classList.add('on');lock(true);t.setAttribute('aria-expanded','true');var cur=side.querySelector('[aria-current]')||side.querySelector('.nav');if(cur)cur.focus({preventScroll:true})}
  else if(ds.role){closeAll();setRole(ds.role,true);toast(ds.role==='owner'?'Showing what owners see':'Showing what office staff see: no Morning screen, no totals')}
  else if(t.id==='searchBtn'){var sb=document.getElementById('searchBox');sb.classList.toggle('open');if(sb.classList.contains('open'))q.focus()}
  else if('close' in ds)dismiss();
  else if('pay' in ds)openPay(ds.pay==='here');
  else if(ds.go){if(ds.go==='plots'&&state.view==='owners'&&state.venture!=='all')state.chartVenture=state.venture;go(ds.go)}
  else if(ds.open){var k=ds.open.split(':');q.value='';results.classList.remove('on');go('customer',{cur:{v:k[0],no:+k[1]},chartVenture:k[0]})}
  else if(ds.approve||ds.hold||ds.undo){
    a=state.approvals.filter(function(x){return x.id===(ds.approve||ds.hold||ds.undo)})[0];
    a.st=ds.approve?'approved':ds.hold?'held':'pending';render();
    toast(ds.approve?a.what+' approved, '+inr(a.amt):ds.hold?a.what+' put on hold':a.what+' is back in the queue');
  }
  else if('chq' in ds){state.chqOpen=!state.chqOpen;renderOwners();document.getElementById('chqBtn').focus()}
  else if(ds.focus){state.focus=state.focus===ds.focus?null:ds.focus;renderPlots()}
  else if(ds.scroll){var el=document.getElementById(ds.scroll);window.scrollTo({top:el.getBoundingClientRect().top+window.scrollY-(document.querySelector('.top').offsetHeight+12),behavior:SMOOTH})}
  else if(ds.doc){var cp=findPlot(state.cur.v,state.cur.no),last=sale(cp).rows.filter(function(r){return r.rcpt}).pop();
    toast(ds.doc==='Receipt'?'Receipt '+last.rcpt+' PDF is ready to print or share':'Statement PDF for Plot '+cp.no+' is ready')}
  else if('wa' in ds){
    var p=findPlot(state.cur.v,state.cur.no),s=sale(p),n=s.rows.filter(function(r){return r.st==='overdue'||r.st==='upcoming'})[0];
    document.getElementById('modalMsg').textContent=n?'Namaste '+p.name.split(' & ')[0]+' garu,\n\n'+(n.st==='overdue'?'Your '+n.label.toLowerCase()+' of '+inr(n.amt)+' for Plot '+p.no+', '+VBY[p.v].name+' was due on '+fdate(n.date)+'. Kindly arrange the payment at the earliest.':'Your '+n.label.toLowerCase()+' of '+inr(n.amt)+' for Plot '+p.no+', '+VBY[p.v].name+' is due on '+fdate(n.date)+'.')+'\n\nBalance: '+inr(s.price-paidOf(s))+'\nPrudhvi Raj Infra Developers, Proddatur'
      :'Namaste '+p.name.split(' & ')[0]+' garu,\n\nNo instalment is due on Plot '+p.no+', '+VBY[p.v].name+'. Thank you.\n\nPrudhvi Raj Infra Developers, Proddatur';
    closeAll();opener=t;scrim.classList.add('on');modal.classList.add('on');lock(true);
  }
  else if(t.id==='waSend'){var pp=findPlot(state.cur.v,state.cur.no);sale(pp).log.unshift('15 Nov 2026, sent from the office number to '+pp.phone);closeAll();render();toast('Reminder opened in WhatsApp and logged on this page')}
});
document.addEventListener('keydown',function(e){if(e.key==='Enter'&&e.target.matches&&e.target.matches('tr[data-open]'))e.target.click()});
document.addEventListener('change',function(e){
  if(e.target.id==='ownVenture'){state.venture=e.target.value;renderOwners();document.getElementById('ownVenture').focus()}
  if(e.target.id==='chartVenture'){state.chartVenture=e.target.value;state.focus=null;render();document.getElementById('chartVenture').focus()}
});
/* ---------- view as owner / staff (shared with the money page) ---------- */
state.role='owner';
function setRole(r,user){
  state.role=r;document.body.classList.toggle('staff',r==='staff');
  try{sessionStorage.setItem('prid-role',r)}catch(e){}
  document.querySelectorAll('[data-role]').forEach(function(b){b.setAttribute('aria-pressed',String(b.dataset.role===r))});
  document.getElementById('sideUser').innerHTML=r==='owner'?'<div class="avatar">PR</div><div><b>Director</b><span>Owner account</span></div>':'<div class="avatar">SR</div><div><b>Sravani</b><span>Office staff</span></div>';
  if(user){if(r==='staff'&&state.view==='owners')go('plots');else render()}
}
var saved='owner';try{saved=sessionStorage.getItem('prid-role')==='staff'?'staff':'owner'}catch(e){}
setRole(saved,false);
route();
})();
</script>
