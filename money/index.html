<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#1B1E20">
<title>Prudhvi Raj back office</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --side:#1B1E20; --side-2:#272B2D; --side-line:#363B3E; --side-text:#D6DADB; --side-mute:#98A0A2;
  --ground:#F4F5F5; --surface:#FFFFFF; --line:#E1E4E4; --line-2:#ECEEEE;
  --ink:#17171A; --ink-2:#44444A; --mute:#66666B;
  --em:#0A6B4A; --em-strong:#07573C; --em-tint:#E2F2EA; --em-line:#B5DCC8;
  --amber:#8A5200; --amber-tint:#FCEFD2; --amber-line:#EBCB8B;
  --red:#B4231B; --red-tint:#FBE6E3; --red-line:#EFB5AF;
  --slate-tint:#E9EBEF; --slate:#3D4656;
  --r:8px; --top:60px;
  --shadow:0 12px 32px rgba(23,23,26,.16), 0 2px 6px rgba(23,23,26,.08);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--ground);color:var(--ink);font:400 15px/1.5 "Geist",system-ui,-apple-system,"Segoe UI",sans-serif;font-feature-settings:"tnum" 1,"cv11" 1;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3,p{margin:0}
a{color:inherit}
:focus-visible{outline:2px solid var(--em);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
svg{display:block;flex:none}
[hidden]{display:none !important}
body.staff .own{display:none !important}
.staff-only{display:none}
body.staff .staff-only{display:inline}
.m-cell{display:none}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100vh;background:linear-gradient(to right,var(--side) 248px,var(--ground) 248px)}
.side{background:var(--side);color:var(--side-text);position:sticky;top:0;height:100vh;display:flex;flex-direction:column;overflow-y:auto}
.side-logo{padding:22px 20px 20px}
.side-logo img{width:104px;height:auto;display:block}
.side-nav{padding:0 12px;display:grid;gap:4px}
.nav{display:flex;align-items:center;gap:12px;width:100%;min-height:44px;padding:8px 10px;border:0;background:none;color:var(--side-text);border-radius:6px;text-align:left;font-weight:500}
.nav:hover{background:var(--side-2)}
.nav[aria-current="page"]{background:#34322F;color:#fff}
.nav.act{margin-top:20px}
.nav .lk{margin-left:auto;color:var(--side-mute)}
.side-role{margin-top:auto;padding:14px 20px 12px;border-top:1px solid var(--side-line)}
.side-role .lab{display:block;font-size:12px;color:var(--side-mute);margin-bottom:6px}
.role-seg{display:inline-grid;grid-template-columns:1fr 1fr;border:1px solid var(--side-line);border-radius:6px;overflow:hidden}
.role-seg button{height:30px;padding:0 12px;border:0;background:none;color:var(--side-text);font-size:13px;font-weight:500}
.role-seg button+button{border-left:1px solid var(--side-line)}
.role-seg button[aria-pressed="true"]{background:#fff;color:var(--ink)}
.side-user{padding:12px 20px 16px;display:flex;gap:10px;align-items:center}
.avatar{width:34px;height:34px;border-radius:50%;background:#45423E;color:#fff;display:grid;place-items:center;font-weight:600;font-size:12px}
.side-user b{display:block;font-weight:500;color:#fff;font-size:14px}
.side-user span{font-size:13px;color:var(--side-mute)}

.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:20;height:var(--top);background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:0 28px}
.today{color:var(--ink-2);font-weight:500}
.top-right{margin-left:auto;display:flex;align-items:center;gap:14px}
.m-only{display:none}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 16px;border-radius:var(--r);border:1px solid var(--line);background:#fff;font-weight:500;white-space:nowrap;transition:background .12s,border-color .12s}
.btn:hover{background:var(--ground);border-color:#CFCFCA}
.btn.primary{background:var(--em);border-color:var(--em);color:#fff}
.btn.primary:hover{background:var(--em-strong);border-color:var(--em-strong)}
.btn.sm{height:36px;padding:0 12px;font-size:14px}
.btn.quiet{border-color:transparent;background:none;color:var(--ink-2);padding:0 12px}
.btn.quiet:hover{background:#E9EBEB;border-color:transparent;color:var(--ink)}
.btn[disabled]{opacity:.55;cursor:default}

.page{padding:32px 28px 72px;max-width:1192px;width:100%}
.page-head{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:24px}
.title{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.page-head h1{font-size:28px;line-height:1.2;font-weight:600;letter-spacing:-.02em}
.head-right{margin-left:auto;display:flex;gap:10px;flex-wrap:wrap}
.scope{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:13px;font-size:13px;font-weight:500;background:var(--side);color:#fff}
.select{position:relative}
.select select{appearance:none;height:40px;border:1px solid var(--line);border-radius:var(--r);background:#fff;padding:0 36px 0 14px;font-weight:500;max-width:100%}
.select svg{position:absolute;right:12px;top:13px;pointer-events:none;color:var(--mute)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:22px 24px}
.card h2{font-size:17px;font-weight:600;letter-spacing:-.005em}
.card-head{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.card-head .meta{margin-left:auto;color:var(--mute);font-size:14px}
.card .lead{color:var(--mute);font-size:14px;margin-top:2px;margin-bottom:6px}
.mt{margin-top:24px}

/* ---------- chips ---------- */
.chip{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 9px;border-radius:5px;font-size:13px;font-weight:500;white-space:nowrap;border:1px solid transparent}
.chip.ok{background:var(--em-tint);color:var(--em-strong);border-color:var(--em-line)}
.chip.warn{background:var(--amber-tint);color:var(--amber);border-color:var(--amber-line)}
.chip.bad{background:var(--red-tint);color:var(--red);border-color:var(--red-line)}
.chip.neutral{background:var(--ground);color:var(--ink-2);border-color:var(--line)}
.chip.dark{background:var(--side);color:#fff}
.chip.cat{background:#fff;color:var(--ink-2);border-color:var(--line)}

/* ---------- headline numbers ---------- */
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:24px;border:1px solid var(--line);border-radius:var(--r);background:#fff;padding:26px 28px 24px;margin-bottom:24px}
.stats.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.stat{align-self:start;padding:0;border:0;background:none;text-align:left;display:block;width:100%;min-width:0}
.stat .k{font-weight:500;color:var(--ink-2)}
.stat .v{font-size:42px;line-height:1.1;font-weight:600;letter-spacing:-.03em;margin:10px 0 8px;white-space:nowrap}
.stats.small .v{font-size:32px}
.stat.pos .v{color:var(--em)}
.stat.neg .v{color:var(--red)}
.stat .n{color:var(--mute)}
button.stat:hover .k{text-decoration:underline;text-underline-offset:3px}

.grid-2{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:24px;align-items:start}
.stack{display:grid;gap:24px;min-width:0}

/* approvals */
.appr{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:6px 24px;align-items:center;padding:14px 0;border-top:1px solid var(--line-2)}
.card-head + .appr{border-top:0;margin-top:4px}
.appr:last-child{padding-bottom:0}
.appr .what{font-weight:600}
.appr .why{color:var(--mute);font-size:14px}
.appr .amt{font-weight:600;font-size:17px;text-align:right;white-space:nowrap}
.appr .acts{display:flex;gap:8px;justify-content:flex-end;align-items:center;min-width:196px}
.appr .acts .btn{min-width:94px}

.row{display:flex;gap:12px;align-items:baseline;padding:11px 0;border-top:1px solid var(--line-2)}
.row:last-child{padding-bottom:0}
.row b{font-weight:500;display:block}
.row .r{margin-left:auto;font-weight:600;white-space:nowrap;text-align:right}
.row .s{color:var(--mute);font-size:14px}
.row.total{border-top:1px solid var(--line);font-weight:600}
button.row{width:100%;border-left:0;border-right:0;border-bottom:0;background:none;text-align:left;min-height:44px;align-items:center}
button.row:hover b{text-decoration:underline;text-underline-offset:3px}
button.row .go{color:var(--mute);margin-left:4px}
.big-n{font-size:32px;font-weight:600;letter-spacing:-.03em;line-height:1.1;margin:8px 0 6px}
.note{color:var(--mute);font-size:14px;margin-top:12px}

/* where the money goes */
.hb{display:block;width:100%;border:0;background:none;padding:12px 0 10px;text-align:left;border-top:1px solid var(--line-2)}
.card-head + .hb{border-top:0;margin-top:6px}
.hb:last-child{padding-bottom:0}
.hb-top{display:flex;align-items:baseline;gap:12px}
.hb-k{font-weight:500}
.hb-v{margin-left:auto;font-weight:600;white-space:nowrap}
.hb-s{color:var(--mute);font-size:14px;min-width:46px;text-align:right}
.hb-track{display:block;height:10px;background:var(--line-2);border-radius:3px;margin-top:8px;overflow:hidden}
.hb-track i{display:block;height:100%;background:var(--slate);border-radius:3px;transition:width .3s ease}
.hb:hover .hb-k{text-decoration:underline;text-underline-offset:3px}
.hb:hover .hb-track i{background:var(--ink)}

/* in and out chart */
.legend2{display:flex;gap:16px;font-size:14px;color:var(--ink-2);margin-top:6px}
.legend2 span{display:inline-flex;align-items:center;gap:6px}
.legend2 i{width:12px;height:12px;border-radius:2px;display:block}
.pairs{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;align-items:end;height:170px;margin-top:30px}
.pair{display:flex;gap:4px;align-items:flex-end;justify-content:center;height:100%}
.pb{position:relative;width:100%;max-width:26px;border-radius:3px 3px 0 0;min-height:2px}
.pb.in{background:var(--em)}
.pb.out{background:var(--slate)}
.pair:not(.now) .pb{opacity:.72}
.pb b{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(100% + 4px);font-size:12px;font-weight:600;white-space:nowrap}
.xaxis{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;padding-top:8px;font-size:14px;color:var(--mute);text-align:center}
.xaxis .now{color:var(--ink);font-weight:600}

/* tables */
table{border-collapse:collapse;width:100%}
th{font-size:14px;font-weight:500;color:var(--mute);text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:13px 12px;border-bottom:1px solid var(--line-2);vertical-align:middle}
th:first-child,td:first-child{padding-left:0} th:last-child,td:last-child{padding-right:0}
tr:last-child td{border-bottom:0;padding-bottom:2px}
.num{text-align:right;white-space:nowrap}
td.num{font-weight:600}
td .sub{display:block;color:var(--mute);font-size:14px;font-weight:400}
td b{font-weight:600}
.mute{color:var(--mute)}
.nw{white-space:nowrap}
.pm{display:none}
.empty{color:var(--mute);padding:14px 0 4px}
.filters{display:flex;gap:10px;flex-wrap:wrap}
.fnote{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:12px 0 4px;color:var(--ink-2);font-size:14px}

/* tabs */
.tabs{display:flex;gap:28px;border-bottom:1px solid var(--line);margin-bottom:24px}
.tab{height:44px;padding:0;border:0;border-bottom:2px solid transparent;margin-bottom:-1px;background:none;font-weight:500;color:var(--ink-2);white-space:nowrap}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--ink);border-color:var(--ink);font-weight:600}

/* labour */
.sheet{display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.sheet p{font-size:17px}
.sheet p b{font-weight:600}
.sheet .btn{margin-left:auto}
.sites{display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin:24px 0 16px}
.seg{display:grid;grid-template-columns:repeat(4,auto);border:1px solid #CFCFCA;border-radius:var(--r);overflow:hidden;background:#fff}
.seg button{height:40px;border:0;border-left:1px solid #CFCFCA;background:#fff;font-weight:500;padding:0 14px;white-space:nowrap}
.seg button:first-child{border-left:0}
.seg button span{color:var(--mute);font-weight:400;margin-left:4px}
.seg button[aria-pressed="true"]{background:var(--side);color:#fff}
.seg button[aria-pressed="true"] span{color:var(--side-mute)}
.seg button .nw,.seg button[aria-pressed="true"] .nw{color:inherit;margin-left:0}
.sites .select{margin-left:auto}
.period{display:flex;gap:6px 16px;flex-wrap:wrap;align-items:baseline;margin-top:2px;color:var(--ink-2)}
.period b{font-weight:600;color:var(--ink)}
.marks{display:flex;gap:14px;flex-wrap:wrap;font-size:14px;color:var(--ink-2);margin:14px 0 6px}
.marks span{display:inline-flex;align-items:center;gap:6px}
.att-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -24px;padding:0 24px}
.att{min-width:860px}
.att th.d,.att td.d{text-align:center;padding-left:2px;padding-right:2px;width:50px}
.att th.d small{display:block;font-size:12px;font-weight:400}
.att th.rain{color:var(--amber)}
.att td{padding-top:6px;padding-bottom:6px}
.att .nm{font-weight:600;display:block;white-space:nowrap}
.att .ro{display:block;color:var(--mute);font-size:14px}
.mk{width:38px;height:38px;border:1px solid var(--line);border-radius:6px;background:#fff;display:inline-grid;place-items:center;color:var(--ink)}
.mk:hover{border-color:var(--ink)}
.mk.P{background:var(--em-tint);border-color:var(--em-line);color:var(--em-strong)}
.mk.H{background:var(--amber-tint);border-color:var(--amber-line);color:var(--amber)}
.mk.A{color:#9A9AA0}
.att tr.tot td{border-top:1px solid var(--line);font-weight:600;padding-top:14px}
.att tfoot tr:last-child td{border-bottom:0}
.more{margin-top:14px}
.prog{height:8px;border-radius:4px;background:var(--line);margin-top:8px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--em);border-radius:4px;transition:width .35s ease}
.wo{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) minmax(0,1fr);gap:20px 32px;padding:20px 0;border-top:1px solid var(--line-2);align-items:start}
.card-head + .wo{border-top:0;padding-top:14px}
.wo:last-child{padding-bottom:0}
.wo .k{color:var(--mute);font-size:14px}
.wo .v{font-weight:600;font-size:17px}
.wo .who{font-weight:600;font-size:16px}
.wo .nxt{grid-column:1 / -1;display:flex;gap:10px;align-items:center;flex-wrap:wrap;color:var(--ink-2)}

/* vehicles */
.flag{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap}
.flag .txt{flex:1 1 420px;min-width:0}
.flag .txt p{font-size:16px;margin-top:8px;max-width:720px}
.flag .acts{display:flex;gap:8px;align-self:center}
td.use{white-space:nowrap}
.slip-no{color:var(--red)}

/* ---------- overlays ---------- */
.scrim{position:fixed;inset:0;background:rgba(23,23,26,.38);opacity:0;pointer-events:none;transition:opacity .18s;z-index:40}
.scrim.on{opacity:1;pointer-events:auto}
.panel{position:fixed;top:0;right:0;bottom:0;width:440px;max-width:100vw;background:#fff;box-shadow:var(--shadow);transform:translateX(102%);transition:transform .22s cubic-bezier(.2,.7,.3,1);z-index:50;display:flex;flex-direction:column;visibility:hidden}
.panel.on{transform:none;visibility:visible}
.panel-head{display:flex;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line)}
.panel-head h2{font-size:17px;font-weight:600}
.x{margin-left:auto;width:36px;height:36px;border:0;background:none;border-radius:var(--r);display:grid;place-items:center}
.x:hover{background:var(--ground)}
.panel-body{padding:20px;overflow-y:auto;flex:1}
.panel-foot{padding:14px 20px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end}
.field{margin-bottom:18px;position:relative}
.field label,.field .lab{display:block;font-weight:500;font-size:13px;margin-bottom:6px}
.field input[type=text]{width:100%;height:44px;border:1px solid #CFCFCA;border-radius:var(--r);padding:0 12px;background:#fff;font-size:15px}
.field .select,.field .select select{width:100%;height:44px}
.field .select select{border-color:#CFCFCA;font-weight:400}
.field .select svg{top:15px}
.field input:focus,.field select:focus{border-color:var(--em);outline:2px solid var(--em-tint);outline-offset:0}
.field .hint{font-size:13px;color:var(--mute);margin-top:6px;min-height:19px}
.field .hint.warn{color:var(--amber)}
.field .err{color:var(--red)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.amt-wrap{position:relative}
.amt-wrap span{position:absolute;left:12px;top:9px;font-size:20px;font-weight:500;color:var(--mute)}
.amt-wrap input{padding-left:34px !important;font-size:22px !important;font-weight:600;height:52px !important;letter-spacing:-.01em}
.seg4{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid #CFCFCA;border-radius:var(--r);overflow:hidden}
.seg4 button{height:44px;border:0;border-left:1px solid #CFCFCA;background:#fff;font-weight:500;font-size:13px;padding:0 4px}
.seg4 button:first-child{border-left:0}
.seg4 button[aria-pressed="true"]{background:var(--side);color:#fff}
.file{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.file input{position:absolute;width:1px;height:1px;opacity:0}
.file label.btn{margin:0;font-size:15px;font-weight:500;height:44px}
.file .fn{color:var(--mute);font-size:14px}
.saved .big{display:flex;gap:12px;align-items:center;padding:14px;border:1px solid var(--em-line);background:var(--em-tint);border-radius:var(--r);color:var(--em-strong);font-weight:500;margin-bottom:16px}
.saved .big.w{border-color:var(--amber-line);background:var(--amber-tint);color:var(--amber)}
.kv{margin:0}
.kv dt{color:var(--mute)}
.kv div{display:flex;gap:12px;padding:10px 0;border-top:1px solid var(--line-2);align-items:baseline}
.kv div:first-child{border-top:0}
.kv dd{margin:0 0 0 auto;font-weight:500;text-align:right}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);background:var(--side);color:#fff;padding:11px 16px;border-radius:var(--r);font-weight:500;opacity:0;pointer-events:none;transition:opacity .18s,transform .18s;z-index:60;max-width:calc(100vw - 32px);box-shadow:var(--shadow)}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* ---------- tablet ---------- */
@media (max-width:1100px){
  .grid-2{display:flex;flex-direction:column;align-items:stretch;gap:20px}
  .stack{display:contents}
  .o1{order:1}.o2{order:2}.o3{order:3}.o4{order:4}.o5{order:5}.o6{order:6}
  .stats{grid-template-columns:1fr 1fr;gap:28px 24px}
  .stats.three{grid-template-columns:1fr 1fr}
  .wo{grid-template-columns:1fr 1fr}
  .wo > :first-child{grid-column:1 / -1}
}
/* ---------- phone ---------- */
@media (max-width:820px){
  :root{--top:56px}
  body{font-size:16px}
  .app{display:block;background:var(--ground)}
  .side{position:fixed;left:0;top:0;bottom:0;width:288px;max-width:86vw;height:auto;z-index:50;transform:translateX(-102%);transition:transform .22s cubic-bezier(.2,.7,.3,1);visibility:hidden}
  .side.on{transform:none;visibility:visible}
  .nav{min-height:48px}
  .role-seg button{height:44px;padding:0 18px}
  .top{background:var(--side);border-bottom:0;padding:0 8px 0 4px;gap:4px;color:#fff}
  .m-only{display:flex}
  .d-only{display:none !important}
  .icon-btn{width:44px;height:44px;border:0;background:none;color:#fff;border-radius:var(--r);display:grid;place-items:center}
  .brand{display:flex;align-items:center;gap:9px;font-weight:600;font-size:16px;min-width:0;margin-right:auto}
  .brand img{height:26px;width:auto}
  .brand span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .today{display:none}
  .top-right{gap:0;margin-left:0}
  .page{padding:20px 16px 150px}
  .page-head{margin-bottom:16px}
  .page-head h1{font-size:26px}
  .head-right{margin-left:0;width:100%}

function vlist(v){return v==='all'?VEN.map(function(x){return x.id}):[v]}

  var o={total:0};CATS.forEach(function(c){o[c]=0});
  vlist(v).forEach(function(id){CATS.forEach(function(c){o[c]+=BASE[id][c]})});
  rows.forEach(function(r){if(!r.inBase&&r.st==='paid'&&(v==='all'||r.v===v))o[r.cat]+=r.amt});
  state.fuelAdd.forEach(function(f){if(v==='all'||f.v===v)o.veh+=f.amt});
  CATS.forEach(function(c){o.total+=o[c]});return o;
}
function inBy(v){return vlist(v).reduce(function(a,id){return a+IN[id]},0)}

  return {lab:lab,bills:bl.reduce(function(a,b){return a+b.amt},0),billN:bl.length,bunk:bunkBy(v)};

function stChip(r){
  if(r.st==='paid')return '<span class="chip ok">'+I.check+'Paid</span>';
  if(r.st==='wait')return '<span class="chip warn">'+I.clock+'Waiting for approval</span>';
  if(r.st==='held')return '<span class="chip neutral">'+I.pause+'Held</span>';
  return '<span class="chip bad">'+I.doc+'Bill due</span>';
}
function billChip(b){
  if(billPaid(b))return '<span class="chip ok">'+I.check+'Paid</span>';
  var d=b.due-15;

}

function drawPay(){
  pTitle.textContent='Add payment out';
  pBody.innerHTML=
  '<div class="field"><label for="fTo">Paid to</label><input id="fTo" type="text" autocomplete="off" placeholder="Supplier, contractor or person" value="'+esc(form.to)+'"><div class="hint" id="fToHint"></div></div>'+
  '<div class="two"><div class="field">'+fsel('fCat','Category',form.cat,CATS.map(function(k){return [k,CS[k]]}))+'</div>'+
  '<div class="field">'+fsel('fVen','Venture',form.v,VEN.map(function(v){return [v.id,v.name]}).concat([['office','Office']]))+'</div></div>'+
  '<div class="field"><label for="fAmt">Amount</label><div class="amt-wrap"><span>₹</span><input id="fAmt" type="text" inputmode="numeric" autocomplete="off" value="'+(form.amt?num(form.amt):'')+'"></div><div class="hint'+(form.amt>25000?' warn':'')+'" id="fAmtHint">'+payHint()+'</div></div>'+
  '<div class="field"><span class="lab" id="modeLab">Mode</span><div class="seg4" role="group" aria-labelledby="modeLab">'+['Cash','Bank transfer','Cheque','UPI'].map(function(m){return '<button type="button" data-mode="'+m+'" aria-pressed="'+(form.mode===m)+'">'+m+'</button>'}).join('')+'</div></div>'+
  '<div class="field"><span class="lab">Bill photo</span><div class="file"><input id="fFile" type="file" accept="image/*,application/pdf"><label class="btn" for="fFile">'+I.cam+'Add bill photo</label><span class="fn" id="fFileName">'+(form.file?esc(form.file):'No photo yet')+'</span></div></div>'+
  '<div class="field" style="margin-bottom:0"><label for="fNote">Note</label><input id="fNote" type="text" autocomplete="off" placeholder="What it was for" value="'+esc(form.note)+'"></div>';
  pFoot.innerHTML='<button class="btn" data-close>Cancel</button><button class="btn primary" id="fSave">Save payment</button>';
}
function fsel(id,label,val,opts){return '<label for="'+id+'">'+label+'</label><div class="select"><select id="'+id+'">'+opts.map(function(o){return '<option value="'+o[0]+'"'+(o[0]===val?' selected':'')+'>'+esc(o[1])+'</option>'}).join('')+'</select>'+I.caret+'</div>'}
function savePay(){
  if(!form.to.trim()){var h=document.getElementById('fToHint');h.className='hint err';h.textContent='Who was paid?';document.getElementById('fTo').focus();return}
  if(!form.amt){var a=document.getElementById('fAmtHint');a.className='hint err';a.textContent='Enter the amount.';document.getElementById('fAmt').focus();return}
  var wait=form.amt>25000,r={id:'n'+state.seq,seq:state.seq++,d:15,to:form.to.trim(),what:form.note.trim()||CS[form.cat]+(form.file?', bill photo added':''),cat:form.cat,v:form.v,amt:form.amt,mode:form.mode,st:wait?'wait':'paid',appr:wait?1:0,by:state.role==='owner'?'Director':'Sravani'};
  rows.unshift(r);
  pTitle.textContent='Payment saved';
  pBody.innerHTML='<div class="saved"><div class="big'+(wait?' w':'')+'">'+(wait?I.clockL:I.checkL)+'<span>'+inr(r.amt)+' to '+esc(r.to)+(wait?' is waiting for an owner to approve.':' saved as paid.')+'</span></div>'+
   '<dl class="kv"><div><dt>Category</dt><dd>'+CS[r.cat]+'</dd></div><div><dt>Venture</dt><dd>'+esc(VN[r.v])+'</dd></div><div><dt>Mode</dt><dd>'+r.mode+'</dd></div><div><dt>Date</dt><dd>15 Nov 2026</dd></div><div><dt>Status</dt><dd>'+(wait?'Waiting for approval':'Paid')+'</dd></div></dl></div>';
  pFoot.innerHTML='<button class="btn" id="fAgain">Add another</button><button class="btn primary" id="fList">See payments</button>';
  render();
}

/* add fuel entry */
var ff;
function openFuel(){
  ff={no:state.fuelVeh||'AP 39 TZ 2284',L:0,amt:0,meter:'',file:''};
  drawFuel();openPanel();setTimeout(function(){document.getElementById('gL').focus()},60);
}
function drawFuel(){
  var x=VH(ff.no);
  pTitle.textContent='Add fuel entry';
  pBody.innerHTML=
  '<div class="field">'+fsel('gVeh','Vehicle',ff.no,VEH.map(function(v){return [v.no,v.no+', '+v.ty]}))+'</div>'+
  '<div class="two"><div class="field"><label for="gL">Litres</label><input id="gL" type="text" inputmode="decimal" autocomplete="off" value="'+(ff.L||'')+'"></div>'+
  '<div class="field"><label for="gAmt">Amount, ₹</label><input id="gAmt" type="text" inputmode="numeric" autocomplete="off" value="'+(ff.amt?num(ff.amt):'')+'"></div></div>'+
  '<div class="field"><label for="gMeter">'+(x.u==='h'?'Hour meter reading':'Odometer, km')+'</label><input id="gMeter" type="text" inputmode="numeric" autocomplete="off" value="'+esc(ff.meter)+'"><div class="hint">Last reading '+num(x.meter)+'</div></div>'+
  '<div class="field" style="margin-bottom:0"><span class="lab">Slip photo</span><div class="file"><input id="gFile" type="file" accept="image/*"><label class="btn" for="gFile">'+I.cam+'Add slip photo</label><span class="fn" id="gFileName">'+(ff.file?esc(ff.file):'No photo yet')+'</span></div><div class="hint">Filled on account at Sri Venkateswara Fuels</div></div>';
  pFoot.innerHTML='<button class="btn" data-close>Cancel</button><button class="btn primary" id="gSave">Save fuel entry</button>';
}
function saveFuel(){
  if(!ff.L){var e=document.getElementById('gL');e.focus();e.style.borderColor='var(--red)';return}
  var x=VH(ff.no),m=parseInt(String(ff.meter).replace(/\D/g,''),10)||0;
  if(!ff.amt)ff.amt=Math.round(ff.L*RATE_L/10)*10;
  if(m>x.meter){x.run+=m-x.meter;x.meter=m}
  x.L+=ff.L;x.rs+=ff.amt;
  fuel.unshift({d:15,no:ff.no,L:ff.L,amt:ff.amt,slip:ff.file?1:0,by:state.role==='owner'?'Director':'Sravani',bunk:'Sri Venkateswara Fuels'});
  state.fuelAdd.push({v:x.v,amt:ff.amt,bunk:1});
  closeAll();render();toast(ff.L+' litres for '+ff.no+' saved'+(ff.file?'':', no slip photo'));
}

panel.addEventListener('input',function(e){
  var t=e.target;
  if(t.id==='fTo')form.to=t.value;
  if(t.id==='fNote')form.note=t.value;
  if(t.id==='fAmt'){var n=parseInt(t.value.replace(/\D/g,''),10)||0;form.amt=n;t.value=n?num(n):'';var h=document.getElementById('fAmtHint');h.className='hint'+(n>25000?' warn':'');h.textContent=payHint()}
  if(t.id==='gL'){ff.L=Math.round((parseFloat(t.value.replace(/[^\d.]/g,''))||0)*10)/10;ff.amt=Math.round(ff.L*RATE_L/10)*10;document.getElementById('gAmt').value=ff.amt?num(ff.amt):''}
  if(t.id==='gAmt'){var a=parseInt(t.value.replace(/\D/g,''),10)||0;ff.amt=a;t.value=a?num(a):''}
  if(t.id==='gMeter')ff.meter=t.value;
});
panel.addEventListener('change',function(e){
  var t=e.target;
  if(t.id==='fCat')form.cat=t.value;
  if(t.id==='fVen')form.v=t.value;
  if(t.id==='fFile'){form.file=t.files[0]?t.files[0].name:'';document.getElementById('fFileName').textContent=form.file||'No photo yet'}
  if(t.id==='gFile'){ff.file=t.files[0]?t.files[0].name:'';document.getElementById('gFileName').textContent=ff.file||'No photo yet'}
  if(t.id==='gVeh'){ff.no=t.value;drawFuel()}
});
panel.addEventListener('click',function(e){
  var b=e.target.closest('button');if(!b)return;
  if(b.dataset.mode){form.mode=b.dataset.mode;panel.querySelectorAll('[data-mode]').forEach(function(x){x.setAttribute('aria-pressed',x===b)})}
  else if(b.id==='fSave')savePay();
  else if(b.id==='gSave')saveFuel();
  else if(b.id==='fAgain')openPay();
  else if(b.id==='fList')go('payments',{pcat:'all',pven:'all'});
});

/* ---------- role ---------- */
function setRole(r,boot){
  state.role=r;document.body.classList.toggle('staff',r==='staff');
  try{sessionStorage.setItem('prid-role',r)}catch(e){}
  document.querySelectorAll('[data-role]').forEach(function(b){b.setAttribute('aria-pressed',b.dataset.role===r)});
  document.getElementById('sideUser').innerHTML=r==='owner'?'<div class="avatar">PR</div><div><b>Director</b><span>Owner account</span></div>':'<div class="avatar">SR</div><div><b>Sravani</b><span>Office staff</span></div>';
  if(boot)return;
  if(r==='staff'&&state.view==='finance')go('payments');else render();
}

/* ---------- global clicks ---------- */
document.addEventListener('click',function(e){
  var t=e.target.closest('[data-go],[data-pay],[data-approve],[data-hold],[data-undo],[data-close],[data-scroll],[data-cat],[data-bills],[data-clear],[data-tab],[data-site],[data-mk],[data-showall],[data-sendwage],[data-addfuel],[data-fuelveh],[data-role],#menuBtn');
  if(!t||(t.closest('#panelBody,#panelFoot')&&!t.hasAttribute('data-close')))return;
  var ds=t.dataset;
  if(t.tagName==='A'&&ds.go)e.preventDefault();
  if(t.id==='menuBtn'){closeAll();opener=t;side.classList.add('on');scrim.classList.add('on');lock(true);t.setAttribute('aria-expanded','true');var cur=side.querySelector('[aria-current]')||side.querySelector('.nav');if(cur)cur.focus({preventScroll:true})}
  else if('close' in ds)dismiss();
  else if(ds.role){closeAll();setRole(ds.role);toast(ds.role==='owner'?'Showing what owners see':'Showing what office staff see: no Finance, no totals')}
  else if('pay' in ds)openPay();
  else if(ds.go)go(ds.go);
  else if(ds.cat)go('payments',{pcat:ds.cat,pven:state.venture});
  else if('bills' in ds){go('payments',{pcat:'all',pven:'all'});var bc=document.getElementById('billsCard');window.scrollTo({top:bc.getBoundingClientRect().top+window.scrollY-(document.querySelector('.top').offsetHeight+12)})}
  else if('clear' in ds){state.pcat='all';state.pven='all';render()}
  else if(ds.approve||ds.hold||ds.undo){
    var id=ds.approve||ds.hold||ds.undo,a=id==='wage'?state.wage:R(id);
    a.st=ds.approve?(a.kind==='wage'?'ok':'paid'):ds.hold?'held':'wait';render();
    toast(ds.approve?(a.kind==='wage'?'Wage sheet approved for Saturday 21 Nov':a.to+' approved and marked paid, '+inr(a.amt)):ds.hold?a.to+' put on hold':a.to+' is back in the queue');
  }
  else if(ds.scroll){var el=document.getElementById(ds.scroll);window.scrollTo({top:el.getBoundingClientRect().top+window.scrollY-(document.querySelector('.top').offsetHeight+12),behavior:SMOOTH})}
  else if(ds.tab){state.tab=ds.tab;render()}
  else if(ds.site){state.site=ds.site;state.showAll=false;render()}
  else if('showall' in ds){state.showAll=!state.showAll;render()}
  else if(ds.mk){var k=ds.mk.split(':'),w=W[state.site][+k[0]];w.m[+k[1]]=MKNEXT[w.m[+k[1]]];render();var nb=page.querySelector('[data-mk="'+ds.mk+'"]');if(nb)nb.focus()}
  else if('sendwage' in ds){
    var tot=SITES.reduce(function(a,s){return a+siteTot(s.id)},0),n=SITES.reduce(function(a,s){return a+W[s.id].length},0);
    state.wage={id:'wage',kind:'wage',to:'Wage sheet, week of 9 to 14 Nov',what:n+' workers at 4 sites, to be paid Saturday 21 Nov',amt:tot,st:'wait',by:state.role==='owner'?'Director':'Sravani',d:15};
    render();toast('Wage sheet sent to the owners for approval');
  }
  else if('addfuel' in ds)openFuel();
  else if('fuelveh' in ds){state.fuelVeh=ds.fuelveh||null;render();if(state.fuelVeh){var fe=document.getElementById('fuelCard');window.scrollTo({top:fe.getBoundingClientRect().top+window.scrollY-(document.querySelector('.top').offsetHeight+12),behavior:SMOOTH})}}
});
document.addEventListener('change',function(e){
  var t=e.target;if(t.closest('#panel'))return;
  if(t.id==='finVenture'){state.venture=t.value;render();document.getElementById('finVenture').focus()}
  if(t.id==='pCat'){state.pcat=t.value;render();document.getElementById('pCat').focus()}
  if(t.id==='pVen'){state.pven=t.value;render();document.getElementById('pVen').focus()}
  if(t.id==='cycle'){state.cycle[state.site]=t.value;render();document.getElementById('cycle').focus()}
});
var savedRole='owner';try{savedRole=sessionStorage.getItem('prid-role')==='staff'?'staff':'owner'}catch(e){}
setRole(savedRole,true);
route();
})();
</script>
</body>
</html>
