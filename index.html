<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#FFFFFF">
<title>Prudhvi Raj back office</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#17171A;--ink-2:#44444A;--mute:#66666B;--line:#E1E4E4;--ground:#F4F5F5;--em:#0A6B4A;--side:#1B1E20}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:#fff;color:var(--ink);font:400 16px/1.5 "Geist",system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
h1,p{margin:0}
:focus-visible{outline:2px solid var(--em);outline-offset:3px}
.wrap{max-width:600px;margin:0 auto;padding:calc(56px + env(safe-area-inset-top,0px)) calc(24px + env(safe-area-inset-right,0px)) calc(40px + env(safe-area-inset-bottom,0px)) calc(24px + env(safe-area-inset-left,0px))}
.logo{display:block;width:88px;height:auto}
h1{font-size:28px;line-height:1.2;font-weight:600;letter-spacing:-.02em;margin-top:32px}
.lead{color:var(--ink-2);margin-top:12px;max-width:460px}
.links{margin-top:40px;border-top:1px solid var(--line)}
.go{display:flex;align-items:center;gap:16px;min-height:96px;padding:20px 4px;border-bottom:1px solid var(--line);color:inherit;text-decoration:none}
.go b{display:block;font-size:21px;font-weight:600;letter-spacing:-.01em;line-height:1.25}
.go span span{display:block;color:var(--mute);font-size:15px;margin-top:4px}
.go svg{margin-left:auto;flex:none;color:var(--mute);transition:transform .15s}
.go:hover b{text-decoration:underline;text-underline-offset:4px;text-decoration-thickness:1px}
.go:hover svg{transform:translateX(3px);color:var(--ink)}
@media (max-width:480px){.wrap{padding-top:calc(36px + env(safe-area-inset-top,0px))}h1{font-size:25px}.go b{font-size:19px}}
@media (prefers-reduced-motion:reduce){*{transition:none !important}}
</style>
</head>
<body>
<main class="wrap">
  <img class="logo" src="img/logo-lockup-ink.png" width="88" height="86" alt="Prudhvi Raj Infra Developers">
  <h1>Prudhvi Raj Infra Developers, back office</h1>
  <p class="lead">A working demonstration with sample figures. No real customer or company data.</p>
  <nav class="links" aria-label="Back office">
    <a class="go" href="plots/index.html"><span><b>Customers and plots</b><span>Morning, plot chart, customers, add payment</span></span><svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 10h12M11 5l5 5-5 5"/></svg></a>
    <a class="go" href="money/index.html"><span><b>Payments, labour and finance</b><span>Finance, payments, labour, vehicles and fuel</span></span><svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 10h12M11 5l5 5-5 5"/></svg></a>
  </nav>
</main>
</body>
</html>
